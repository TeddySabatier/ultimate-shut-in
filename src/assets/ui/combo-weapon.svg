<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- mop-spear: broom handle taped to a kitchen knife -->
  <g transform="rotate(45 16 16)">
    <rect x="2" y="14.5" width="18" height="3" fill="#b8741f" stroke="#0f0f14" stroke-width="1"/>
    <rect x="2" y="14.5" width="18" height="1" fill="#e2a44a"/>
    <!-- duct tape -->
    <rect x="17" y="13" width="5" height="6" fill="#8a8a9e" stroke="#0f0f14" stroke-width="1"/>
    <path d="M18 13.5l3 5M19.5 13.5l2 3" stroke="#c7c7d6" stroke-width="0.8"/>
    <!-- blade -->
    <path d="M22 13.5h4l5 2.5-5 2.5h-4z" fill="#e8e8f0" stroke="#0f0f14" stroke-width="1"/>
    <path d="M23 16h6" stroke="#8a8a9e" stroke-width="0.8"/>
    <!-- mop strands at the butt -->
    <path d="M2 14.5l-2-3M2 16l-2.5 0M2 17.5l-2 3M3.5 17.5l-1 3.5M3.5 14.5l-1-3.5" stroke="#7c5cff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>

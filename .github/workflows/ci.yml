name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Mini games load lazily: no manifest, engine or strings in the main chunk (docs/design/games/CONTRACT.md).
      - name: Check the main chunk holds no game
        run: node scripts/check-main-chunk.mjs

      - name: Check PWA artifacts
        run: |
          test -f dist/manifest.webmanifest
          test -f dist/sw.js

  e2e:
    name: E2E ${{ matrix.name }}
    runs-on: ubuntu-latest
    # No `needs: check`: the shards start at once and build the app themselves,
    # so the wall time is the slowest shard, not check plus e2e.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The mobile project is the heavier one (a11y audit, viewport sweep), so it takes two shards.
          - { name: 'mobile 1/2', project: mobile-chromium, shard: '1/2', report: mobile-1 }
          - { name: 'mobile 2/2', project: mobile-chromium, shard: '2/2', report: mobile-2 }
          - { name: 'desktop', project: desktop-chromium, shard: '1/1', report: desktop }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run e2e shard
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.report }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
